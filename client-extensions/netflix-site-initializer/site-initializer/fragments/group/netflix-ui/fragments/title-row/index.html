<section
  class="nf-row"
  data-chihiro-backdrop="[resources:el-viaje-de-chihiro-backdrop.jpg]"
>
  <h2 class="nf-row__title">${configuration.rowTitle}</h2>
  <div class="nf-row__viewport">
    <button class="nf-row__nav nf-row__nav--prev" type="button" aria-label="Ver anteriores" disabled>&#8249;</button>
    <div class="nf-row__track" role="list" aria-busy="true">
      [#-- Cards vacías que se ven mientras cargan los títulos --]
      [#list 1..8 as i]
        <div class="nf-movie-card nf-movie-card--skeleton" aria-hidden="true">
          <div class="nf-movie-card__poster"></div>
        </div>
      [/#list]
    </div>
    <button class="nf-row__nav nf-row__nav--next" type="button" aria-label="Ver siguientes" disabled>&#8250;</button>
  </div>
  <p class="nf-row__status" hidden></p>

  <dialog class="nf-row__dialog">
    <div class="nf-row__dialog-inner">
      <div class="nf-row__dialog-media">
        <img alt="" class="nf-row__dialog-image" />
        <h2 class="nf-row__dialog-title"></h2>
        <button class="nf-row__dialog-close" type="button" aria-label="Cerrar">&times;</button>
      </div>

      <div class="nf-row__dialog-body">
        <ul class="nf-row__dialog-meta"></ul>
        <p class="nf-row__dialog-synopsis"></p>
        <p class="nf-row__dialog-extra" data-field="elenco" hidden>
          <span class="nf-row__dialog-label">Elenco:</span> <span class="nf-row__dialog-value"></span>
        </p>
        <p class="nf-row__dialog-extra" data-field="generos" hidden>
          <span class="nf-row__dialog-label">Géneros:</span> <span class="nf-row__dialog-value"></span>
        </p>
      </div>
    </div>
  </dialog>
</section>
