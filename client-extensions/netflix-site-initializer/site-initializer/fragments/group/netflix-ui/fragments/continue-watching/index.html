<section
  class="nf-continue"
  data-chihiro-backdrop="[resources:el-viaje-de-chihiro-backdrop.jpg]"
  hidden
>
  <h2 class="nf-continue__title">${configuration.rowTitle}</h2>

  <div class="nf-continue__viewport">
    <div
      aria-busy="true"
      aria-label="Títulos para continuar viendo"
      class="nf-continue__track"
      role="list"
    ></div>
  </div>

  <p class="nf-continue__status" hidden></p>

  <dialog class="nf-continue__dialog">
    <div class="nf-continue__dialog-inner">
      <div class="nf-continue__dialog-media">
        <img alt="" class="nf-continue__dialog-image" />
        <h2 class="nf-continue__dialog-title"></h2>
        <button class="nf-continue__dialog-close" type="button" aria-label="Cerrar">&times;</button>
      </div>

      <div class="nf-continue__dialog-body">
        <ul class="nf-continue__dialog-meta"></ul>
        <p class="nf-continue__dialog-synopsis"></p>
        <p class="nf-continue__dialog-extra" data-field="elenco" hidden>
          <span class="nf-continue__dialog-label">Elenco:</span>
          <span class="nf-continue__dialog-value"></span>
        </p>
        <p class="nf-continue__dialog-extra" data-field="generos" hidden>
          <span class="nf-continue__dialog-label">Géneros:</span>
          <span class="nf-continue__dialog-value"></span>
        </p>
      </div>
    </div>
  </dialog>
</section>
