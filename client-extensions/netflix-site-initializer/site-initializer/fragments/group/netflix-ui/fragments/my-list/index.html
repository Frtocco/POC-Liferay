<section
  class="nf-mylist"
  data-chihiro-backdrop="[resources:el-viaje-de-chihiro-backdrop.jpg]"
  data-layout-mode="${layoutMode!""}"
  data-perfiles-path="${configuration.perfilesPath}"
>
  <h1 class="nf-mylist__title" tabindex="-1">${configuration.titulo}</h1>

  <div class="nf-mylist__grid" role="list" aria-busy="true" aria-label="${configuration.titulo}">
    [#list 1..6 as i]
    <div class="nf-movie-card nf-movie-card--skeleton" aria-hidden="true">
      <div class="nf-movie-card__poster"></div>
    </div>
    [/#list]
  </div>

  <div class="nf-mylist__empty" hidden>
    <p class="nf-mylist__empty-text">${configuration.textoVacio}</p>
    <a class="nf-mylist__empty-link" href="${configuration.homePath}">Explorar títulos</a>
  </div>

  <p class="nf-mylist__status" hidden></p>

  <dialog class="nf-mylist__dialog">
    <div class="nf-mylist__dialog-media">
      <img alt="" class="nf-mylist__dialog-image" />
      <h2 class="nf-mylist__dialog-title"></h2>
      <button class="nf-mylist__dialog-close" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <div class="nf-mylist__dialog-body">
      <ul class="nf-mylist__dialog-meta"></ul>
      <p class="nf-mylist__dialog-synopsis"></p>
      <p class="nf-mylist__dialog-extra" data-field="elenco" hidden>
        <span class="nf-mylist__dialog-label">Elenco:</span> <span class="nf-mylist__dialog-value"></span>
      </p>
      <p class="nf-mylist__dialog-extra" data-field="generos" hidden>
        <span class="nf-mylist__dialog-label">Géneros:</span> <span class="nf-mylist__dialog-value"></span>
      </p>
    </div>
  </dialog>
</section>
