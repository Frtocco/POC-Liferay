<section
  class="nf-trending"
  data-chihiro-backdrop="[resources:el-viaje-de-chihiro-backdrop.jpg]"
>
  <h2 class="nf-trending__title">${configuration.rowTitle}</h2>

  <div class="nf-trending__viewport">
    <button
      aria-label="Ver tendencias anteriores"
      class="nf-trending__nav nf-trending__nav--prev"
      disabled
      type="button"
    >&#8249;</button>

    <div
      aria-busy="true"
      aria-label="Ranking de tendencias"
      class="nf-trending__track"
      role="list"
    >
      [#list 1..5 as rank]
        <div class="nf-trending-card nf-trending-card--skeleton" aria-hidden="true">
          <span class="nf-trending-card__rank">${rank}</span>
          <div class="nf-trending-card__poster"></div>
        </div>
      [/#list]
    </div>

    <button
      aria-label="Ver tendencias siguientes"
      class="nf-trending__nav nf-trending__nav--next"
      disabled
      type="button"
    >&#8250;</button>
  </div>

  <p class="nf-trending__status" hidden></p>

  <dialog class="nf-trending__dialog">
    <div class="nf-trending__dialog-inner">
      <div class="nf-trending__dialog-media">
        <img alt="" class="nf-trending__dialog-image" />
        <h2 class="nf-trending__dialog-title"></h2>
        <button class="nf-trending__dialog-close" type="button" aria-label="Cerrar">&times;</button>
      </div>

      <div class="nf-trending__dialog-body">
        <ul class="nf-trending__dialog-meta"></ul>
        <p class="nf-trending__dialog-synopsis"></p>
        <p class="nf-trending__dialog-extra" data-field="elenco" hidden>
          <span class="nf-trending__dialog-label">Elenco:</span> <span class="nf-trending__dialog-value"></span>
        </p>
        <p class="nf-trending__dialog-extra" data-field="generos" hidden>
          <span class="nf-trending__dialog-label">G&eacute;neros:</span> <span class="nf-trending__dialog-value"></span>
        </p>
      </div>
    </div>
  </dialog>
</section>
