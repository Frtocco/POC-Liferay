## POC Netflix: registro y login

# Permitir que cualquiera cree su cuenta
company.security.strangers=true

# Sin verificación por email (no hay servidor de correo en local)
company.security.strangers.verify=false

# Después del login, ir al selector de perfiles
default.landing.page.path=/web/netflix-poc/perfiles

# Todo usuario nuevo queda como miembro del sitio
admin.default.group.names=Netflix POC

# Sin pantallas extra en el primer login (términos de uso y pregunta de seguridad)
terms.of.use.required=false
users.reminder.queries.enabled=false
auth.login.url=/web/netflix-poc/login